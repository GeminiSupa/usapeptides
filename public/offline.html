<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1F4233">
  <meta name="robots" content="noindex">
  <title>You are offline</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #FDFBF0; color: #1F4233; font: 16px/1.65 system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: 100%; max-width: 440px; border: 1px solid #c9c2aa; padding: 32px; }
    h1 { font-size: 28px; line-height: 1.2; }
    p { color: #2a3530; }
    a { display: inline-block; padding: 12px 24px; background: #1F4233; color: #FDFBF0; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>Connect to the internet to browse products, sign in or place an order.</p>
    <p>If you were submitting an order, check your order history after reconnecting before trying again.</p>
    <a href="">Try again</a>
  </main>
</body>
</html>
